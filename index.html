<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Blox Fruits - Multi-Account Tracker</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="dashboard-container">
    <header>
      <h1>🏴‍☠️ Blox Fruits Tracker</h1>
      <nav class="tab-navigation">
        <button class="tab-btn active" data-tab="tab-dashboard">📊 Dashboard Comptes</button>
        <button class="tab-btn" data-tab="tab-catalog">🍇 Catalogue & Stock Total</button>
      </nav>
    </header>

    <main id="tab-dashboard" class="tab-content active">
      <div class="account-selector-container">
        <label for="account-select">👤 Compte actif :</label>
        <select id="account-select"></select>
      </div>

      <section class="stats-grid">
        <div class="card">
          <div class="card-icon">⚡</div>
          <div class="card-info">
            <h3>Niveau</h3>
            <p id="player-level">0</p>
          </div>
        </div>
        <div class="card beli">
          <div class="card-icon">💵</div>
          <div class="card-info">
            <h3>Beli</h3>
            <p id="player-beli">$0</p>
          </div>
        </div>
        <div class="card fragments">
          <div class="card-icon">🔮</div>
          <div class="card-info">
            <h3>Fragments</h3>
            <p id="player-fragments">0</p>
          </div>
        </div>
        <div class="card fruits-count">
          <div class="card-icon">🧺</div>
          <div class="card-info">
            <h3>Total Fruits (Ce compte)</h3>
            <p id="player-fruit-count">0</p>
          </div>
        </div>
      </section>

      <section class="fruits-section">
        <h2>Inventaire du compte sélectionné</h2>
        <div class="fruits-grid" id="my-fruits-container"></div>
      </section>
    </main>

    <main id="tab-catalog" class="tab-content">
      
      <div class="filter-container">
        <div class="filter-group">
          <button class="filter-btn active" data-rarity="all">Toutes <span class="count-badge" id="count-all">0</span></button>
          <button class="filter-btn common" data-rarity="Commun">Commun <span class="count-badge" id="count-commun">0</span></button>
          <button class="filter-btn uncommon" data-rarity="Peu commun">Peu commun <span class="count-badge" id="count-peu-commun">0</span></button>
          <button class="filter-btn rare" data-rarity="Rare">Rare <span class="count-badge" id="count-rare">0</span></button>
          <button class="filter-btn legendary" data-rarity="Légendaire">Légendaire <span class="count-badge" id="count-legendaire">0</span></button>
          <button class="filter-btn mythic" data-rarity="Mythique">Mythique <span class="count-badge" id="count-mythique">0</span></button>
        </div>
      </div>

      <div class="fruits-grid" id="catalog-container"></div>
    </main>
  </div>

  <script src="script.js"></script>
</body>
</html>
